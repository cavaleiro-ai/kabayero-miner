name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest ja traz o Android SDK em $ANDROID_HOME; so garantimos
      # licencas aceitas e os pacotes que o projeto usa (platform 35, build-tools 35).
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissao do gradlew
        run: chmod +x gradlew

      - name: Testes unitarios (BIP39/BIP32/BIP84, SHA-256d, Stratum)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: APK debug (instalavel)
        run: ./gradlew assembleDebug --no-daemon

      - name: APK release (nao assinado; assine com sua chave)
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: kabayero-miner-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/
